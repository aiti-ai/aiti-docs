# Build the VuePress site and publish it to the gh-pages branch on every push
# to main. GitHub Pages serves the site at https://aiti.pw from that branch
# (custom domain configured in the Pages settings and a CNAME in the output).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sanitize check — no internal values in the public source
        run: |
          if grep -rnE 'alot\.pw|/home/wind|192\.168\.[0-9]|Rolling · liyong|01a095d2-6994-7345|packages/pi-web-ext|packages/aiti-bridge|packages/aiti-devtools|dsh-web-ext|openclaw-web-ext' docs --include='*.md' --include='*.ts' --include='*.mjs' --include='*.json'; then
            echo '::error::Internal values found in the public docs source — remove them before merging.'
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm docs:build

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/.vuepress/dist
          force_orphan: true
          cname: aiti.pw
